# Homologação do IMPA: Caddy (HTTPS + SPA) → API → PostgreSQL.
# Uso: docker compose -f deploy/docker-compose.homolog.yml --env-file deploy/.env up -d --build
# O impa-frontend precisa estar clonado ao lado do impa-backend (ou em CAMINHO_FRONTEND).
name: impa-homolog

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: impa
      POSTGRES_USER: impa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - postgres-dados:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U impa -d impa"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      # Gss Encryption Mode=Disable: sem Kerberos; evita a busca por libgssapi_krb5 (ausente na imagem).
      ConnectionStrings__Impa: Host=postgres;Port=5432;Database=impa;Username=impa;Password=${POSTGRES_PASSWORD};Gss Encryption Mode=Disable
      IMPA_ADMIN_USUARIO: ${IMPA_ADMIN_USUARIO:?defina IMPA_ADMIN_USUARIO no .env}
      IMPA_ADMIN_SENHA: ${IMPA_ADMIN_SENHA:?defina IMPA_ADMIN_SENHA no .env}
      IMPA_ADMIN_NOME: ${IMPA_ADMIN_NOME:-Administrador}
      Empresa__Nome: ${EMPRESA_NOME:-Impacto Papelaria}
      MediatR__LicenseKey: ${MEDIATR_LICENSE_KEY:-}
    volumes:
      - chaves-sessao:/keys
    depends_on:
      postgres:
        condition: service_healthy
    # /api/health por HTTP dentro do container (a imagem não tem curl/wget: bash com /dev/tcp).
    # Saudável só depois das migrações e do seed, e com o banco respondendo.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      additional_contexts:
        frontend: ${CAMINHO_FRONTEND:-../../impa-frontend}
    environment:
      DOMINIO: ${DOMINIO:?defina DOMINIO no .env}
    ports:
      - "${PORTA_HTTP:-80}:80"
      - "${PORTA_HTTPS:-443}:443"
      - "${PORTA_HTTPS:-443}:443/udp"
    volumes:
      - caddy-dados:/data
      - caddy-config:/config
    # Só publica a SPA quando a API responde: sem 502 na subida nem nas atualizações.
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-dados:
  chaves-sessao:
  caddy-dados:
  caddy-config:
